services:
  postgres:
    image: ${PIDAFIX3_POSTGRES_IMAGE:?PIDAFIX3_POSTGRES_IMAGE is required}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    platform: linux/amd64
    environment:
      POSTGRES_DB: platforma_pidafix3
      POSTGRES_USER: platforma
      POSTGRES_PASSWORD: ${PIDAFIX3_POSTGRES_PASSWORD:?PIDAFIX3_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${PIDAFIX3_POSTGRES_PORT:?PIDAFIX3_POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platforma -d platforma_pidafix3"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${PIDAFIX3_API_IMAGE:?PIDAFIX3_API_IMAGE is required}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: test
      PORT: "3000"
      WEB_ORIGIN: http://127.0.0.1:${PIDAFIX3_WEB_PORT:?PIDAFIX3_WEB_PORT is required}
      PUBLIC_APP_URL: http://127.0.0.1:${PIDAFIX3_WEB_PORT:?PIDAFIX3_WEB_PORT is required}
      DATABASE_URL: postgresql://platforma:${PIDAFIX3_POSTGRES_PASSWORD}@postgres:5432/platforma_pidafix3?schema=public
      REDIS_URL: redis://127.0.0.1:9
      S3_ENDPOINT: http://127.0.0.1:9
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: pidafix3-local
      S3_SECRET_ACCESS_KEY: pidafix3-local
      MINIO_BUCKET: pidafix3-local
      TRAINING_MODULE_ENABLED: "false"
      TRAINING_AI_MODE: fake
      TRAINING_VOICE_WORKER_ENABLED: "false"
      TRAINING_MATERIAL_WORKER_ENABLED: "false"
      TRAINING_TELEGRAM_OUTBOX_WORKER_ENABLED: "false"
      TELEGRAM_TRANSPORT_MODE: fake
      FEED_AUTO_IMPORT_ENABLED: "false"
      PROJECT_PRESENTATIONS_WORKER_ENABLED: "false"
      ASSISTANT_MODULE_ENABLED: "true"
      ASSISTANT_ROLLOUT_STAGE: ADMINS
      ASSISTANT_AI_MODE: fake
      ASSISTANT_QUERY_PLANNER_LIVE: "false"
      ASSISTANT_PAID_CALLS_CONFIRMED: "false"
      ASSISTANT_EMBEDDING_MODE: fake
      ASSISTANT_EMBEDDING_LIVE: "false"
      ASSISTANT_GEO_PROVIDER_ENABLED: "true"
      ASSISTANT_GEO_PROVIDER_MODE: fake
      ASSISTANT_GEO_PROVIDER_MAX_RETRIES: "0"
      LOCATIONIQ_API_URL: http://127.0.0.1:9/locationiq
      ASSISTANT_OVERPASS_ENABLED: "false"
      ASSISTANT_OVERPASS_URL: http://127.0.0.1:9/overpass
      ASSISTANT_ALIBABA_BASE_URL: http://127.0.0.1:9/alibaba
      OPENROUTESERVICE_API_URL: http://127.0.0.1:9/openrouteservice
      ASSISTANT_EXTERNAL_CONNECTORS_ENABLED: "false"
      ASSISTANT_SOURCE_WORKER_ENABLED: "false"
      ASSISTANT_SOURCE_BROWSER_FALLBACK_ENABLED: "false"
      JWT_ACCESS_SECRET: ${PIDAFIX3_JWT_ACCESS_SECRET:?PIDAFIX3_JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${PIDAFIX3_JWT_REFRESH_SECRET:?PIDAFIX3_JWT_REFRESH_SECRET is required}
      JWT_MEDIA_SECRET: ${PIDAFIX3_JWT_MEDIA_SECRET:?PIDAFIX3_JWT_MEDIA_SECRET is required}
      EMAIL_AUTH_SECRET: ${PIDAFIX3_EMAIL_AUTH_SECRET:?PIDAFIX3_EMAIL_AUTH_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PIDAFIX3_API_PORT:?PIDAFIX3_API_PORT is required}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 45
    stop_grace_period: 20s

  web:
    image: ${PIDAFIX3_WEB_IMAGE:?PIDAFIX3_WEB_IMAGE is required}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:${PIDAFIX3_API_PORT:?PIDAFIX3_API_PORT is required}
    environment:
      MAP_PROVIDER_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PIDAFIX3_WEB_PORT:?PIDAFIX3_WEB_PORT is required}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
