services:
  api:
    environment:
      ASSISTANT_PIDAFIX3_GEO_LIVE_SMOKE: "true"
      ASSISTANT_GEO_PROVIDER_ENABLED: "true"
      ASSISTANT_GEO_PROVIDER_MODE: locationiq
      ASSISTANT_GEO_PROVIDER_MAX_RETRIES: "0"
      ASSISTANT_GEO_MAX_LOCATIONIQ_ATTEMPTS_PER_RESOLVE: "2"
      ASSISTANT_GEO_MAX_OVERPASS_ATTEMPTS_PER_RESOLVE: "1"
      ASSISTANT_GEO_PROVIDER_REQUESTS_PER_MINUTE: "8"
      ASSISTANT_GEO_PROVIDER_DAILY_BUDGET: "8"
      ASSISTANT_GEO_CACHE_TTL_SECONDS: "3600"
      LOCATIONIQ_API_KEY: ${PIDAFIX3_LOCATIONIQ_API_KEY:?PIDAFIX3_LOCATIONIQ_API_KEY is required}
      LOCATIONIQ_API_URL: https://us1.locationiq.com/v1/search
      ASSISTANT_OVERPASS_ENABLED: "true"
      ASSISTANT_OVERPASS_REQUESTS_PER_MINUTE: "3"
      ASSISTANT_OVERPASS_DAILY_BUDGET: "3"
      ASSISTANT_OVERPASS_URL: https://overpass-api.de/api/interpreter
      ASSISTANT_AI_MODE: fake
      ASSISTANT_QUERY_PLANNER_LIVE: "false"
      ASSISTANT_PAID_CALLS_CONFIRMED: "false"
      ASSISTANT_EMBEDDING_MODE: fake
      ASSISTANT_EMBEDDING_LIVE: "false"
      ASSISTANT_OPENAI_BASE_URL: http://127.0.0.1:9/openai
      ASSISTANT_EXTERNAL_CONNECTORS_ENABLED: "false"
      ASSISTANT_SOURCE_WORKER_ENABLED: "false"
      ASSISTANT_SOURCE_BROWSER_FALLBACK_ENABLED: "false"
      FEED_AUTO_IMPORT_ENABLED: "false"
      TRAINING_MODULE_ENABLED: "false"
      TELEGRAM_TRANSPORT_MODE: fake

  web:
    environment:
      MAP_PROVIDER_ENABLED: "true"
      MAP_STYLE_URL: http://127.0.0.1:${PIDAFIX3_MAP_PORT:?PIDAFIX3_MAP_PORT is required}/style.json
