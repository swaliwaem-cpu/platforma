name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required for staging}"

services:
  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required for staging}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required for staging}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for staging}"
  minio:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required for staging}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required for staging}"
  api:
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: staging
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required for staging}"
      STAGING_DATABASE_ALLOWED_HOSTS: "${STAGING_DATABASE_ALLOWED_HOSTS:?STAGING_DATABASE_ALLOWED_HOSTS is required}"
      STAGING_DATABASE_NAME: "${STAGING_DATABASE_NAME:?STAGING_DATABASE_NAME is required}"
      KNOWN_PRODUCTION_DATABASE_IDENTITIES: "${KNOWN_PRODUCTION_DATABASE_IDENTITIES:?KNOWN_PRODUCTION_DATABASE_IDENTITIES is required}"
      STAGING_ALLOW_FAKE_PROVIDERS: "${STAGING_ALLOW_FAKE_PROVIDERS:-false}"
      TELEGRAM_TRANSPORT_MODE: real
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:?TELEGRAM_WEBHOOK_URL is required}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}"
      WEB_ORIGIN: "${WEB_ORIGIN:?WEB_ORIGIN is required}"
      VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
      OPENAI_PROVIDER_MODE: "${OPENAI_PROVIDER_MODE:-fake}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}"
      S3_REGION: "${S3_REGION:?S3_REGION is required}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      TRAINING_DOCUMENT_BUCKET: "${TRAINING_DOCUMENT_BUCKET:?TRAINING_DOCUMENT_BUCKET is required}"
      TRAINING_AUDIO_BUCKET: "${TRAINING_AUDIO_BUCKET:?TRAINING_AUDIO_BUCKET is required}"
      KNOWN_PRODUCTION_BUCKETS: "${KNOWN_PRODUCTION_BUCKETS:?KNOWN_PRODUCTION_BUCKETS is required}"
      STAGING_PUBLIC_HOSTS: "${STAGING_PUBLIC_HOSTS:?STAGING_PUBLIC_HOSTS is required}"
      KNOWN_PRODUCTION_PUBLIC_HOSTS: "${KNOWN_PRODUCTION_PUBLIC_HOSTS:?KNOWN_PRODUCTION_PUBLIC_HOSTS is required}"
      KNOWN_PRODUCTION_TELEGRAM_BOT_USERNAMES: "${KNOWN_PRODUCTION_TELEGRAM_BOT_USERNAMES:?KNOWN_PRODUCTION_TELEGRAM_BOT_USERNAMES is required}"
  training-worker:
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: staging
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required for staging}"
      STAGING_DATABASE_ALLOWED_HOSTS: "${STAGING_DATABASE_ALLOWED_HOSTS:?STAGING_DATABASE_ALLOWED_HOSTS is required}"
      STAGING_DATABASE_NAME: "${STAGING_DATABASE_NAME:?STAGING_DATABASE_NAME is required}"
      KNOWN_PRODUCTION_DATABASE_IDENTITIES: "${KNOWN_PRODUCTION_DATABASE_IDENTITIES:?KNOWN_PRODUCTION_DATABASE_IDENTITIES is required}"
      STAGING_ALLOW_FAKE_PROVIDERS: "${STAGING_ALLOW_FAKE_PROVIDERS:-false}"
      TELEGRAM_TRANSPORT_MODE: real
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:?TELEGRAM_WEBHOOK_URL is required}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}"
      WEB_ORIGIN: "${WEB_ORIGIN:?WEB_ORIGIN is required}"
      VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
      OPENAI_PROVIDER_MODE: "${OPENAI_PROVIDER_MODE:-fake}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}"
      S3_REGION: "${S3_REGION:?S3_REGION is required}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      TRAINING_DOCUMENT_BUCKET: "${TRAINING_DOCUMENT_BUCKET:?TRAINING_DOCUMENT_BUCKET is required}"
      TRAINING_AUDIO_BUCKET: "${TRAINING_AUDIO_BUCKET:?TRAINING_AUDIO_BUCKET is required}"
      KNOWN_PRODUCTION_BUCKETS: "${KNOWN_PRODUCTION_BUCKETS:?KNOWN_PRODUCTION_BUCKETS is required}"
      STAGING_PUBLIC_HOSTS: "${STAGING_PUBLIC_HOSTS:?STAGING_PUBLIC_HOSTS is required}"
      KNOWN_PRODUCTION_PUBLIC_HOSTS: "${KNOWN_PRODUCTION_PUBLIC_HOSTS:?KNOWN_PRODUCTION_PUBLIC_HOSTS is required}"
      KNOWN_PRODUCTION_TELEGRAM_BOT_USERNAMES: "${KNOWN_PRODUCTION_TELEGRAM_BOT_USERNAMES:?KNOWN_PRODUCTION_TELEGRAM_BOT_USERNAMES is required}"
  web:
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
    environment:
      VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
