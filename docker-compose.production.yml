services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports: !reset []

  api:
    image: "${API_IMAGE:?API_IMAGE is required}"
    init: true
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      STAGING_ALLOW_FAKE_PROVIDERS: "false"
      FEED_AUTO_IMPORT_ENABLED: "${FEED_AUTO_IMPORT_ENABLED:?FEED_AUTO_IMPORT_ENABLED is required}"
      WEB_ORIGIN: "${WEB_ORIGIN:?WEB_ORIGIN is required}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}"
      S3_REGION: "${S3_REGION:?S3_REGION is required}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      TRAINING_AUDIO_BUCKET: "${TRAINING_AUDIO_BUCKET:?TRAINING_AUDIO_BUCKET is required and must differ from MINIO_BUCKET}"
      TRAINING_MATERIAL_BUCKET: "${TRAINING_MATERIAL_BUCKET:?TRAINING_MATERIAL_BUCKET is required and must differ from other buckets}"
      TRAINING_MODULE_ENABLED: "${TRAINING_MODULE_ENABLED:?TRAINING_MODULE_ENABLED is required}"
      TRAINING_VOICE_WORKER_ENABLED: "false"
      TRAINING_MATERIAL_WORKER_ENABLED: "true"
      TRAINING_AI_MODE: openai
      TRAINING_CROSS_PROJECT_GENERATION_REUSE_ENABLED: "false"
      TRAINING_HARMLESS_EXTRA_ROUTING_ENABLED: "false"
      TRAINING_MATERIAL_MAX_BYTES: "104857600"
      TRAINING_MATERIAL_BROWSER_FALLBACK_ENABLED: "false"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      OPENAI_TRANSCRIPTION_MODEL: "${OPENAI_TRANSCRIPTION_MODEL:?OPENAI_TRANSCRIPTION_MODEL is required}"
      OPENAI_QUESTION_GENERATION_MODEL: "${OPENAI_QUESTION_GENERATION_MODEL:?OPENAI_QUESTION_GENERATION_MODEL is required}"
      OPENAI_QUESTION_GENERATION_LUNA_MODEL: "${OPENAI_QUESTION_GENERATION_LUNA_MODEL:?OPENAI_QUESTION_GENERATION_LUNA_MODEL is required}"
      OPENAI_QUESTION_GENERATION_STRATEGY: terra_only
      OPENAI_EVALUATOR_MODEL: "${OPENAI_EVALUATOR_MODEL:?OPENAI_EVALUATOR_MODEL is required}"
      OPENAI_EVALUATOR_REASONING: "${OPENAI_EVALUATOR_REASONING:?OPENAI_EVALUATOR_REASONING is required}"
      TELEGRAM_TRANSPORT_MODE: real
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:?TELEGRAM_WEBHOOK_URL is required}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      JWT_MEDIA_SECRET: "${JWT_MEDIA_SECRET:?JWT_MEDIA_SECRET is required}"
      EMAIL_AUTH_SECRET: "${EMAIL_AUTH_SECRET:?EMAIL_AUTH_SECRET is required}"
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST is required}"
      SMTP_PORT: "${SMTP_PORT:?SMTP_PORT is required}"
      SMTP_SECURE: "${SMTP_SECURE:?SMTP_SECURE is required}"
      SMTP_USER: "${SMTP_USER:?SMTP_USER is required}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
      MAIL_FROM: "${MAIL_FROM:?MAIL_FROM is required}"
      WP_DB_HOST: "${WP_DB_HOST:?WP_DB_HOST is required}"
      WP_DB_PORT: "${WP_DB_PORT:?WP_DB_PORT is required}"
      WP_DB_USER: "${WP_DB_USER:?WP_DB_USER is required}"
      WP_DB_PASSWORD: "${WP_DB_PASSWORD:?WP_DB_PASSWORD is required}"
      WP_DB_NAME: "${WP_DB_NAME:?WP_DB_NAME is required}"
      WP_TABLE_PREFIX: "${WP_TABLE_PREFIX:?WP_TABLE_PREFIX is required}"
      WP_UPLOADS_PATH: "${WP_UPLOADS_PATH:?WP_UPLOADS_PATH is required}"
    volumes: !override
      - "${WP_UPLOADS_HOST_PATH:?WP_UPLOADS_HOST_PATH is required}:${WP_UPLOADS_PATH:?WP_UPLOADS_PATH is required}:ro"

  training-voice-worker:
    image: "${API_IMAGE:?API_IMAGE is required}"
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}"
      S3_REGION: "${S3_REGION:?S3_REGION is required}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}"
      MINIO_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
      TRAINING_AUDIO_BUCKET: "${TRAINING_AUDIO_BUCKET:?TRAINING_AUDIO_BUCKET is required and must differ from MINIO_BUCKET}"
      TRAINING_MATERIAL_BUCKET: "${TRAINING_MATERIAL_BUCKET:?TRAINING_MATERIAL_BUCKET is required and must differ from other buckets}"
      TRAINING_MODULE_ENABLED: "${TRAINING_MODULE_ENABLED:?TRAINING_MODULE_ENABLED is required}"
      TRAINING_VOICE_WORKER_ENABLED: "true"
      TRAINING_MATERIAL_WORKER_ENABLED: "false"
      TRAINING_TELEGRAM_OUTBOX_WORKER_ENABLED: "false"
      TRAINING_AI_MODE: openai
      TRAINING_CROSS_PROJECT_GENERATION_REUSE_ENABLED: "false"
      TRAINING_HARMLESS_EXTRA_ROUTING_ENABLED: "false"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      OPENAI_TRANSCRIPTION_MODEL: "${OPENAI_TRANSCRIPTION_MODEL:?OPENAI_TRANSCRIPTION_MODEL is required}"
      OPENAI_QUESTION_GENERATION_MODEL: "${OPENAI_QUESTION_GENERATION_MODEL:?OPENAI_QUESTION_GENERATION_MODEL is required}"
      OPENAI_QUESTION_GENERATION_LUNA_MODEL: "${OPENAI_QUESTION_GENERATION_LUNA_MODEL:?OPENAI_QUESTION_GENERATION_LUNA_MODEL is required}"
      OPENAI_QUESTION_GENERATION_STRATEGY: terra_only
      OPENAI_EVALUATOR_MODEL: "${OPENAI_EVALUATOR_MODEL:?OPENAI_EVALUATOR_MODEL is required}"
      OPENAI_EVALUATOR_REASONING: "${OPENAI_EVALUATOR_REASONING:?OPENAI_EVALUATOR_REASONING is required}"
      TELEGRAM_TRANSPORT_MODE: real
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:?TELEGRAM_WEBHOOK_URL is required}"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1
    stop_grace_period: 30s

  web:
    image: "${WEB_IMAGE:?WEB_IMAGE is required}"
    restart: unless-stopped
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
    environment:
      VITE_API_URL: "${VITE_API_URL:?VITE_API_URL is required}"
    ports: !override
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
