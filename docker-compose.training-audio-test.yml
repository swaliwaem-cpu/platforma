name: platforma-training-audio-test

services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: training_audio_test
      POSTGRES_USER: training_audio_test
      POSTGRES_PASSWORD: training_audio_test_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U training_audio_test -d training_audio_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: training_audio_test
      MINIO_ROOT_PASSWORD: training_audio_test_password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /data

  audio-tests:
    init: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "sh",
        "-c",
        "pnpm --dir apps/api exec prisma migrate deploy && node apps/api/tests/training-audio-docker.integration.cjs",
      ]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://training_audio_test:training_audio_test_password@postgres:5432/training_audio_test?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: training_audio_test
      S3_SECRET_ACCESS_KEY: training_audio_test_password
      MINIO_BUCKET: training-audio-general-test
      TRAINING_DOCUMENT_BUCKET: training-document-private-test
      TRAINING_AUDIO_BUCKET: training-audio-private-test
      TRAINING_AUDIO_WORKER_POLL_MS: "50"
      TRAINING_AUDIO_WORKER_CONCURRENCY: "1"
      TRAINING_AUDIO_WORKER_LEASE_MS: "1000"
      TRAINING_AUDIO_WORKER_HEARTBEAT_MS: "100"
      TRAINING_AUDIO_WORKER_DRAIN_TIMEOUT_MS: "1000"
      TRAINING_AUDIO_TEMP_DIR: /tmp/platforma-training-audio-docker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:size=536870912,mode=1777
