name: platforma-training-full-chain

services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: training_full_chain
      POSTGRES_USER: training_full_chain
      POSTGRES_PASSWORD: training_full_chain_password
    ports:
      - "127.0.0.1:${TRAINING_E2E_POSTGRES_PORT:?TRAINING_E2E_POSTGRES_PORT is required}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U training_full_chain -d training_full_chain",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: training_full_chain
      MINIO_ROOT_PASSWORD: training_full_chain_password
    ports:
      - "127.0.0.1:${TRAINING_E2E_MINIO_PORT:?TRAINING_E2E_MINIO_PORT is required}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /data

  training-worker:
    init: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/training/training-worker.main.js"]
    environment:
      NODE_ENV: test
      DEPLOYMENT_ENV: development
      TRAINING_MODULE_ENABLED: "true"
      TELEGRAM_TRANSPORT_MODE: fake
      TELEGRAM_BOT_USERNAME: platforma_training_e2e_bot
      OPENAI_PROVIDER_MODE: fake
      OPENAI_SMOKE_ENABLED: "false"
      DATABASE_URL: postgresql://training_full_chain:training_full_chain_password@postgres:5432/training_full_chain?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${TRAINING_E2E_MINIO_PORT:?TRAINING_E2E_MINIO_PORT is required}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: training_full_chain
      S3_SECRET_ACCESS_KEY: training_full_chain_password
      MINIO_BUCKET: training-full-chain-general
      TRAINING_DOCUMENT_BUCKET: training-full-chain-documents
      TRAINING_AUDIO_BUCKET: training-full-chain-audio
      TRAINING_AUDIO_WORKER_POLL_MS: "50"
      TRAINING_AUDIO_WORKER_CONCURRENCY: "1"
      TRAINING_AUDIO_WORKER_LEASE_MS: "30000"
      TRAINING_AUDIO_WORKER_HEARTBEAT_MS: "1000"
      TRAINING_AUDIO_WORKER_DRAIN_TIMEOUT_MS: "5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    stop_grace_period: 10s
