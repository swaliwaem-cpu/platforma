name: platforma

services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platforma}
      POSTGRES_USER: ${POSTGRES_USER:-platforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platforma_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platforma} -d ${POSTGRES_DB:-platforma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platforma}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platforma_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    init: true
    image: ${PLATFORMA_API_IMAGE:-platforma-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      NODE_ENV: ${NODE_ENV:-development}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      STAGING_ALLOW_FAKE_PROVIDERS: ${STAGING_ALLOW_FAKE_PROVIDERS:-false}
      FEED_AUTO_IMPORT_ENABLED: ${FEED_AUTO_IMPORT_ENABLED:-true}
      TRAINING_MODULE_ENABLED: ${TRAINING_MODULE_ENABLED:-false}
      TELEGRAM_TRANSPORT_MODE: ${TELEGRAM_TRANSPORT_MODE:-fake}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-platforma_training_bot}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-http://localhost:3000/training/telegram/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_LINK_TOKEN_TTL_MINUTES: ${TELEGRAM_LINK_TOKEN_TTL_MINUTES:-15}
      TELEGRAM_LINK_TOKEN_COOLDOWN_SECONDS: ${TELEGRAM_LINK_TOKEN_COOLDOWN_SECONDS:-30}
      TELEGRAM_LINK_TOKEN_MAX_ISSUES_PER_HOUR: ${TELEGRAM_LINK_TOKEN_MAX_ISSUES_PER_HOUR:-10}
      TELEGRAM_WEBHOOK_MAX_BODY_BYTES: ${TELEGRAM_WEBHOOK_MAX_BODY_BYTES:-98304}
      TELEGRAM_WORKER_POLL_MS: ${TELEGRAM_WORKER_POLL_MS:-250}
      TELEGRAM_WORKER_LEASE_MS: ${TELEGRAM_WORKER_LEASE_MS:-30000}
      TELEGRAM_WORKER_HEARTBEAT_MS: ${TELEGRAM_WORKER_HEARTBEAT_MS:-5000}
      TELEGRAM_WORKER_DRAIN_TIMEOUT_MS: ${TELEGRAM_WORKER_DRAIN_TIMEOUT_MS:-10000}
      PORT: ${API_PORT:-3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://platforma:platforma_password@postgres:5432/platforma?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-platforma}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-platforma_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-platforma}
      TRAINING_DOCUMENT_BUCKET: ${TRAINING_DOCUMENT_BUCKET:-platforma-training-private}
      TRAINING_AUDIO_BUCKET: ${TRAINING_AUDIO_BUCKET:-platforma-training-audio-private}
      TRAINING_AUDIO_MAX_BYTES: ${TRAINING_AUDIO_MAX_BYTES:-20971520}
      TRAINING_AUDIO_MAX_ANSWER_BYTES: ${TRAINING_AUDIO_MAX_ANSWER_BYTES:-83886080}
      TRAINING_AUDIO_MAX_SEGMENTS: ${TRAINING_AUDIO_MAX_SEGMENTS:-32}
      TRAINING_AUDIO_MAX_DURATION_SECONDS: ${TRAINING_AUDIO_MAX_DURATION_SECONDS:-600}
      TRAINING_AUDIO_DOWNLOAD_TIMEOUT_MS: ${TRAINING_AUDIO_DOWNLOAD_TIMEOUT_MS:-30000}
      TRAINING_FFMPEG_TIMEOUT_MS: ${TRAINING_FFMPEG_TIMEOUT_MS:-90000}
      OPENAI_PROVIDER_MODE: ${OPENAI_PROVIDER_MODE:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe-2025-12-15}
      OPENAI_TRANSCRIPTION_REVIEW_MODEL: ${OPENAI_TRANSCRIPTION_REVIEW_MODEL:-gpt-4o-transcribe}
      OPENAI_EVALUATION_MODEL: ${OPENAI_EVALUATION_MODEL:-gpt-5.6-terra}
      OPENAI_EVALUATION_REASONING: ${OPENAI_EVALUATION_REASONING:-medium}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.6-terra}
      OPENAI_REVIEW_REASONING: ${OPENAI_REVIEW_REASONING:-high}
      OPENAI_TRANSCRIPTION_TIMEOUT_MS: ${OPENAI_TRANSCRIPTION_TIMEOUT_MS:-60000}
      OPENAI_EVALUATION_TIMEOUT_MS: ${OPENAI_EVALUATION_TIMEOUT_MS:-120000}
      OPENAI_TRANSCRIPTION_MAX_RETRIES: ${OPENAI_TRANSCRIPTION_MAX_RETRIES:-2}
      OPENAI_EVALUATION_MAX_RETRIES: ${OPENAI_EVALUATION_MAX_RETRIES:-2}
      OPENAI_TRANSCRIPTION_MAX_BYTES: ${OPENAI_TRANSCRIPTION_MAX_BYTES:-25165824}
      OPENAI_MAX_RESPONSE_BYTES: ${OPENAI_MAX_RESPONSE_BYTES:-2097152}
      OPENAI_EVALUATION_MAX_OUTPUT_TOKENS: ${OPENAI_EVALUATION_MAX_OUTPUT_TOKENS:-4096}
      OPENAI_SMOKE_ENABLED: ${OPENAI_SMOKE_ENABLED:-false}
      TRAINING_AUDIO_WORKER_POLL_MS: ${TRAINING_AUDIO_WORKER_POLL_MS:-500}
      TRAINING_AUDIO_WORKER_CONCURRENCY: ${TRAINING_AUDIO_WORKER_CONCURRENCY:-2}
      TRAINING_AUDIO_WORKER_LEASE_MS: ${TRAINING_AUDIO_WORKER_LEASE_MS:-120000}
      TRAINING_AUDIO_WORKER_HEARTBEAT_MS: ${TRAINING_AUDIO_WORKER_HEARTBEAT_MS:-5000}
      TRAINING_AUDIO_WORKER_DRAIN_TIMEOUT_MS: ${TRAINING_AUDIO_WORKER_DRAIN_TIMEOUT_MS:-30000}
      TRAINING_AUDIO_TEMP_DIR: ${TRAINING_AUDIO_TEMP_DIR:-/tmp/platforma-training-audio}
      TRAINING_AUDIO_RETENTION_DAYS: ${TRAINING_AUDIO_RETENTION_DAYS:-0}
      FILE_IMAGE_MAX_SIZE_BYTES: ${FILE_IMAGE_MAX_SIZE_BYTES:-10485760}
      FILE_PDF_MAX_SIZE_BYTES: ${FILE_PDF_MAX_SIZE_BYTES:-52428800}
      TRAINING_MAX_DOCUMENT_BYTES: ${TRAINING_MAX_DOCUMENT_BYTES:-52428800}
      TRAINING_MAX_DOCUMENT_UNCOMPRESSED_BYTES: ${TRAINING_MAX_DOCUMENT_UNCOMPRESSED_BYTES:-209715200}
      TRAINING_MAX_DOCUMENT_ENTRY_BYTES: ${TRAINING_MAX_DOCUMENT_ENTRY_BYTES:-52428800}
      TRAINING_MAX_DOCUMENT_ZIP_ENTRIES: ${TRAINING_MAX_DOCUMENT_ZIP_ENTRIES:-5000}
      TRAINING_MAX_EXTRACTED_CHARACTERS: ${TRAINING_MAX_EXTRACTED_CHARACTERS:-1000000}
      TRAINING_MAX_EXTRACTION_SEGMENTS: ${TRAINING_MAX_EXTRACTION_SEGMENTS:-50000}
      TRAINING_DOCUMENT_EXTRACTION_TIMEOUT_MS: ${TRAINING_DOCUMENT_EXTRACTION_TIMEOUT_MS:-30000}
      TRAINING_DOCUMENT_JOB_POLL_MS: ${TRAINING_DOCUMENT_JOB_POLL_MS:-2000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_MEDIA_SECRET: ${JWT_MEDIA_SECRET:-change-me-media-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      MEDIA_TOKEN_TTL_MINUTES: ${MEDIA_TOKEN_TTL_MINUTES:-200}
      EMAIL_AUTH_SECRET: ${EMAIL_AUTH_SECRET:-change-me-email-auth-secret}
      EMAIL_AUTH_TTL_MINUTES: ${EMAIL_AUTH_TTL_MINUTES:-15}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-platforma_refresh_token}
      MEDIA_COOKIE_NAME: ${MEDIA_COOKIE_NAME:-platforma_media_token}
      SMTP_HOST: ${SMTP_HOST:-smtp.beget.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WP_DB_HOST: ${WP_DB_HOST:-host.docker.internal}
      WP_DB_PORT: ${WP_DB_PORT:-3306}
      WP_DB_SOCKET: ${WP_DB_SOCKET:-}
      WP_DB_USER: ${WP_DB_USER:-wp_readonly}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD:-password}
      WP_DB_NAME: ${WP_DB_NAME:-local}
      WP_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_POST_TYPE: ${WP_POST_TYPE:-nedvizhimosts}
      WP_IMPORT_LIMIT: ${WP_IMPORT_LIMIT:-}
      WP_UPLOADS_PATH: ${WP_UPLOADS_PATH:-/wp-uploads}
    volumes:
      - ${WP_UPLOADS_HOST_PATH:-./tools/wp-import/uploads}:${WP_UPLOADS_PATH:-/wp-uploads}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  training-worker:
    init: true
    image: ${PLATFORMA_API_IMAGE:-platforma-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/training/training-worker.main.js"]
    environment:
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      NODE_ENV: ${NODE_ENV:-development}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      STAGING_ALLOW_FAKE_PROVIDERS: ${STAGING_ALLOW_FAKE_PROVIDERS:-false}
      TRAINING_MODULE_ENABLED: ${TRAINING_MODULE_ENABLED:-false}
      TELEGRAM_TRANSPORT_MODE: ${TELEGRAM_TRANSPORT_MODE:-fake}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-platforma_training_bot}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-http://localhost:3000/training/telegram/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_LINK_TOKEN_TTL_MINUTES: ${TELEGRAM_LINK_TOKEN_TTL_MINUTES:-15}
      TELEGRAM_LINK_TOKEN_COOLDOWN_SECONDS: ${TELEGRAM_LINK_TOKEN_COOLDOWN_SECONDS:-30}
      TELEGRAM_LINK_TOKEN_MAX_ISSUES_PER_HOUR: ${TELEGRAM_LINK_TOKEN_MAX_ISSUES_PER_HOUR:-10}
      TELEGRAM_WEBHOOK_MAX_BODY_BYTES: ${TELEGRAM_WEBHOOK_MAX_BODY_BYTES:-98304}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://platforma:platforma_password@postgres:5432/platforma?schema=public}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-platforma}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-platforma_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-platforma}
      TRAINING_DOCUMENT_BUCKET: ${TRAINING_DOCUMENT_BUCKET:-platforma-training-private}
      TRAINING_AUDIO_BUCKET: ${TRAINING_AUDIO_BUCKET:-platforma-training-audio-private}
      TRAINING_AUDIO_MAX_BYTES: ${TRAINING_AUDIO_MAX_BYTES:-20971520}
      TRAINING_AUDIO_MAX_ANSWER_BYTES: ${TRAINING_AUDIO_MAX_ANSWER_BYTES:-83886080}
      TRAINING_AUDIO_MAX_SEGMENTS: ${TRAINING_AUDIO_MAX_SEGMENTS:-32}
      TRAINING_AUDIO_MAX_DURATION_SECONDS: ${TRAINING_AUDIO_MAX_DURATION_SECONDS:-600}
      TRAINING_AUDIO_DOWNLOAD_TIMEOUT_MS: ${TRAINING_AUDIO_DOWNLOAD_TIMEOUT_MS:-30000}
      TRAINING_FFMPEG_TIMEOUT_MS: ${TRAINING_FFMPEG_TIMEOUT_MS:-90000}
      OPENAI_PROVIDER_MODE: ${OPENAI_PROVIDER_MODE:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe-2025-12-15}
      OPENAI_TRANSCRIPTION_REVIEW_MODEL: ${OPENAI_TRANSCRIPTION_REVIEW_MODEL:-gpt-4o-transcribe}
      OPENAI_EVALUATION_MODEL: ${OPENAI_EVALUATION_MODEL:-gpt-5.6-terra}
      OPENAI_EVALUATION_REASONING: ${OPENAI_EVALUATION_REASONING:-medium}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.6-terra}
      OPENAI_REVIEW_REASONING: ${OPENAI_REVIEW_REASONING:-high}
      OPENAI_TRANSCRIPTION_TIMEOUT_MS: ${OPENAI_TRANSCRIPTION_TIMEOUT_MS:-60000}
      OPENAI_EVALUATION_TIMEOUT_MS: ${OPENAI_EVALUATION_TIMEOUT_MS:-120000}
      OPENAI_TRANSCRIPTION_MAX_RETRIES: ${OPENAI_TRANSCRIPTION_MAX_RETRIES:-2}
      OPENAI_EVALUATION_MAX_RETRIES: ${OPENAI_EVALUATION_MAX_RETRIES:-2}
      OPENAI_TRANSCRIPTION_MAX_BYTES: ${OPENAI_TRANSCRIPTION_MAX_BYTES:-25165824}
      OPENAI_MAX_RESPONSE_BYTES: ${OPENAI_MAX_RESPONSE_BYTES:-2097152}
      OPENAI_EVALUATION_MAX_OUTPUT_TOKENS: ${OPENAI_EVALUATION_MAX_OUTPUT_TOKENS:-4096}
      OPENAI_SMOKE_ENABLED: ${OPENAI_SMOKE_ENABLED:-false}
      TRAINING_AUDIO_WORKER_POLL_MS: ${TRAINING_AUDIO_WORKER_POLL_MS:-500}
      TRAINING_AUDIO_WORKER_CONCURRENCY: ${TRAINING_AUDIO_WORKER_CONCURRENCY:-2}
      TRAINING_AUDIO_WORKER_LEASE_MS: ${TRAINING_AUDIO_WORKER_LEASE_MS:-120000}
      TRAINING_AUDIO_WORKER_HEARTBEAT_MS: ${TRAINING_AUDIO_WORKER_HEARTBEAT_MS:-5000}
      TRAINING_AUDIO_WORKER_DRAIN_TIMEOUT_MS: ${TRAINING_AUDIO_WORKER_DRAIN_TIMEOUT_MS:-30000}
      TRAINING_AUDIO_TEMP_DIR: ${TRAINING_AUDIO_TEMP_DIR:-/tmp/platforma-training-audio}
      TRAINING_AUDIO_RETENTION_DAYS: ${TRAINING_AUDIO_RETENTION_DAYS:-0}
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp/platforma-training-audio:size=536870912,mode=0700
    stop_grace_period: 45s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:
