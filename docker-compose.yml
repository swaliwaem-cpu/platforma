name: platforma

services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platforma}
      POSTGRES_USER: ${POSTGRES_USER:-platforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platforma_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platforma} -d ${POSTGRES_DB:-platforma}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platforma}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-platforma_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-platforma-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      FEED_AUTO_IMPORT_ENABLED: ${FEED_AUTO_IMPORT_ENABLED:-true}
      PORT: ${API_PORT:-3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://platforma:platforma_password@postgres:5432/platforma?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-platforma}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-platforma_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-platforma}
      TRAINING_AUDIO_BUCKET: ${TRAINING_AUDIO_BUCKET:-platforma-training-audio}
      TRAINING_MATERIAL_BUCKET: ${TRAINING_MATERIAL_BUCKET:-platforma-training-materials}
      TRAINING_MODULE_ENABLED: ${TRAINING_MODULE_ENABLED:-true}
      TELEGRAM_TRANSPORT_MODE: ${TELEGRAM_TRANSPORT_MODE:-fake}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-5000}
      TRAINING_FFMPEG_TIMEOUT_MS: ${TRAINING_FFMPEG_TIMEOUT_MS:-30000}
      TRAINING_VOICE_WORKER_ENABLED: "false"
      TRAINING_MATERIAL_WORKER_ENABLED: "true"
      TRAINING_MATERIAL_WORKER_CONCURRENCY: ${TRAINING_MATERIAL_WORKER_CONCURRENCY:-1}
      TRAINING_MATERIAL_WORKER_SHUTDOWN_DRAIN_MS: ${TRAINING_MATERIAL_WORKER_SHUTDOWN_DRAIN_MS:-10000}
      TRAINING_VOICE_WORKER_CONCURRENCY: ${TRAINING_VOICE_WORKER_CONCURRENCY:-3}
      TRAINING_VOICE_WORKER_SHUTDOWN_DRAIN_MS: ${TRAINING_VOICE_WORKER_SHUTDOWN_DRAIN_MS:-10000}
      TRAINING_AI_MODE: ${TRAINING_AI_MODE:-fake}
      TRAINING_CROSS_PROJECT_GENERATION_REUSE_ENABLED: ${TRAINING_CROSS_PROJECT_GENERATION_REUSE_ENABLED:-false}
      TRAINING_MATERIAL_MAX_BYTES: ${TRAINING_MATERIAL_MAX_BYTES:-26214400}
      TRAINING_MATERIAL_EXTRACTION_TIMEOUT_MS: ${TRAINING_MATERIAL_EXTRACTION_TIMEOUT_MS:-60000}
      TRAINING_MATERIAL_MAX_TEXT_CHARS: ${TRAINING_MATERIAL_MAX_TEXT_CHARS:-2000000}
      TRAINING_MATERIAL_BROWSER_FALLBACK_ENABLED: ${TRAINING_MATERIAL_BROWSER_FALLBACK_ENABLED:-false}
      TRAINING_MATERIAL_BROWSER_TIMEOUT_MS: ${TRAINING_MATERIAL_BROWSER_TIMEOUT_MS:-30000}
      TRAINING_MATERIAL_BROWSER_EXECUTABLE_PATH: ${TRAINING_MATERIAL_BROWSER_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
      TRAINING_MATERIAL_SUGGESTION_TIMEOUT_MS: ${TRAINING_MATERIAL_SUGGESTION_TIMEOUT_MS:-120000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-}
      OPENAI_QUESTION_GENERATION_MODEL: ${OPENAI_QUESTION_GENERATION_MODEL:-gpt-5.6-terra}
      OPENAI_QUESTION_GENERATION_LUNA_MODEL: ${OPENAI_QUESTION_GENERATION_LUNA_MODEL:-gpt-5.6-luna}
      OPENAI_QUESTION_GENERATION_STRATEGY: ${OPENAI_QUESTION_GENERATION_STRATEGY:-terra_only}
      OPENAI_QUESTION_GENERATION_REASONING: ${OPENAI_QUESTION_GENERATION_REASONING:-low}
      OPENAI_QUESTION_GENERATION_SOURCE_MAX_CHARS: ${OPENAI_QUESTION_GENERATION_SOURCE_MAX_CHARS:-30000}
      OPENAI_QUESTION_GENERATION_MAX_OUTPUT_TOKENS: ${OPENAI_QUESTION_GENERATION_MAX_OUTPUT_TOKENS:-7000}
      OPENAI_QUESTION_GENERATION_LEASE_MS: ${OPENAI_QUESTION_GENERATION_LEASE_MS:-180000}
      OPENAI_EVALUATOR_MODEL: ${OPENAI_EVALUATOR_MODEL:-}
      OPENAI_EVALUATOR_REASONING: ${OPENAI_EVALUATOR_REASONING:-medium}
      OPENAI_EVALUATION_MODEL: ${OPENAI_EVALUATION_MODEL:-}
      OPENAI_EVALUATION_REASONING: ${OPENAI_EVALUATION_REASONING:-medium}
      OPENAI_TRANSCRIPTION_TIMEOUT_MS: ${OPENAI_TRANSCRIPTION_TIMEOUT_MS:-60000}
      OPENAI_EVALUATION_TIMEOUT_MS: ${OPENAI_EVALUATION_TIMEOUT_MS:-120000}
      OPENAI_TRANSCRIPTION_MAX_RETRIES: ${OPENAI_TRANSCRIPTION_MAX_RETRIES:-2}
      OPENAI_EVALUATION_MAX_RETRIES: ${OPENAI_EVALUATION_MAX_RETRIES:-2}
      OPENAI_EVALUATION_MAX_OUTPUT_TOKENS: ${OPENAI_EVALUATION_MAX_OUTPUT_TOKENS:-4000}
      FILE_IMAGE_MAX_SIZE_BYTES: ${FILE_IMAGE_MAX_SIZE_BYTES:-10485760}
      FILE_PDF_MAX_SIZE_BYTES: ${FILE_PDF_MAX_SIZE_BYTES:-52428800}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_MEDIA_SECRET: ${JWT_MEDIA_SECRET:-change-me-media-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      MEDIA_TOKEN_TTL_MINUTES: ${MEDIA_TOKEN_TTL_MINUTES:-200}
      EMAIL_AUTH_SECRET: ${EMAIL_AUTH_SECRET:-change-me-email-auth-secret}
      EMAIL_AUTH_TTL_MINUTES: ${EMAIL_AUTH_TTL_MINUTES:-15}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-platforma_refresh_token}
      MEDIA_COOKIE_NAME: ${MEDIA_COOKIE_NAME:-platforma_media_token}
      SMTP_HOST: ${SMTP_HOST:-smtp.beget.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WP_DB_HOST: ${WP_DB_HOST:-host.docker.internal}
      WP_DB_PORT: ${WP_DB_PORT:-3306}
      WP_DB_SOCKET: ${WP_DB_SOCKET:-}
      WP_DB_USER: ${WP_DB_USER:-wp_readonly}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD:-password}
      WP_DB_NAME: ${WP_DB_NAME:-local}
      WP_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_POST_TYPE: ${WP_POST_TYPE:-nedvizhimosts}
      WP_IMPORT_LIMIT: ${WP_IMPORT_LIMIT:-}
      WP_UPLOADS_PATH: ${WP_UPLOADS_PATH:-/wp-uploads}
    volumes:
      - ${WP_UPLOADS_HOST_PATH:-./tools/wp-import/uploads}:${WP_UPLOADS_PATH:-/wp-uploads}:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  training-voice-worker:
    image: ${API_IMAGE:-platforma-api:local}
    command: ["node", "apps/api/dist/training-voice-worker.main.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://platforma:platforma_password@postgres:5432/platforma?schema=public}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-platforma}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-platforma_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-platforma}
      TRAINING_AUDIO_BUCKET: ${TRAINING_AUDIO_BUCKET:-platforma-training-audio}
      TRAINING_MATERIAL_BUCKET: ${TRAINING_MATERIAL_BUCKET:-platforma-training-materials}
      TRAINING_MODULE_ENABLED: ${TRAINING_MODULE_ENABLED:-true}
      TELEGRAM_TRANSPORT_MODE: ${TELEGRAM_TRANSPORT_MODE:-fake}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_REQUEST_TIMEOUT_MS: ${TELEGRAM_REQUEST_TIMEOUT_MS:-5000}
      TRAINING_FFMPEG_TIMEOUT_MS: ${TRAINING_FFMPEG_TIMEOUT_MS:-30000}
      TRAINING_VOICE_WORKER_ENABLED: "true"
      TRAINING_MATERIAL_WORKER_ENABLED: "false"
      TRAINING_VOICE_WORKER_CONCURRENCY: ${TRAINING_VOICE_WORKER_CONCURRENCY:-3}
      TRAINING_VOICE_WORKER_SHUTDOWN_DRAIN_MS: ${TRAINING_VOICE_WORKER_SHUTDOWN_DRAIN_MS:-10000}
      TRAINING_TELEGRAM_OUTBOX_WORKER_ENABLED: "false"
      TRAINING_AI_MODE: ${TRAINING_AI_MODE:-fake}
      TRAINING_CROSS_PROJECT_GENERATION_REUSE_ENABLED: ${TRAINING_CROSS_PROJECT_GENERATION_REUSE_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-}
      OPENAI_QUESTION_GENERATION_MODEL: ${OPENAI_QUESTION_GENERATION_MODEL:-gpt-5.6-terra}
      OPENAI_QUESTION_GENERATION_LUNA_MODEL: ${OPENAI_QUESTION_GENERATION_LUNA_MODEL:-gpt-5.6-luna}
      OPENAI_QUESTION_GENERATION_STRATEGY: ${OPENAI_QUESTION_GENERATION_STRATEGY:-terra_only}
      OPENAI_QUESTION_GENERATION_REASONING: ${OPENAI_QUESTION_GENERATION_REASONING:-low}
      OPENAI_QUESTION_GENERATION_SOURCE_MAX_CHARS: ${OPENAI_QUESTION_GENERATION_SOURCE_MAX_CHARS:-30000}
      OPENAI_EVALUATOR_MODEL: ${OPENAI_EVALUATOR_MODEL:-}
      OPENAI_EVALUATOR_REASONING: ${OPENAI_EVALUATOR_REASONING:-medium}
      OPENAI_EVALUATION_MODEL: ${OPENAI_EVALUATION_MODEL:-}
      OPENAI_EVALUATION_REASONING: ${OPENAI_EVALUATION_REASONING:-medium}
      OPENAI_TRANSCRIPTION_TIMEOUT_MS: ${OPENAI_TRANSCRIPTION_TIMEOUT_MS:-60000}
      OPENAI_EVALUATION_TIMEOUT_MS: ${OPENAI_EVALUATION_TIMEOUT_MS:-120000}
      OPENAI_TRANSCRIPTION_MAX_RETRIES: ${OPENAI_TRANSCRIPTION_MAX_RETRIES:-2}
      OPENAI_EVALUATION_MAX_RETRIES: ${OPENAI_EVALUATION_MAX_RETRIES:-2}
      OPENAI_EVALUATION_MAX_OUTPUT_TOKENS: ${OPENAI_EVALUATION_MAX_OUTPUT_TOKENS:-4000}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 1
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:
